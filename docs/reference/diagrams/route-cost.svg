linecap='round'/><circle cx='521' cy='241' r='5' fill='#33D6A6'/><circle cx='691' cy='71' r='7' fill='none' stroke='#EC3750' stroke-width='3'/><text x='24' y='298' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5'>The first two routes are identical to a flood fill that counts cells. On the floor they are</text><text x='24' y='315' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5'>seconds apart, because every turn is a decelerate-rotate-accelerate cycle. Cost turns, not cells.</text></svg>
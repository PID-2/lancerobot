<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">2S battery to 5 volt and 3.3 volt Micromouse power flow</title>
  <desc id="desc">A protected two-cell battery feeds a fuse and switch, then a buck converter adjusted to five volts. The five volt rail powers the ESP32-C6 board, whose onboard regulator supplies three point three volts to the sensors. All grounds are common.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07151a"/>
      <stop offset="1" stop-color="#111921"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8C37"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33D6A6"/>
    </marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#f4f7f8}.label{font:700 22px Arial,sans-serif;fill:#f4f7f8}.small{font:500 17px Arial,sans-serif;fill:#b8c4c9}.mono{font:700 17px Consolas,monospace;letter-spacing:1px}.box{fill:#111d22;stroke:#334951;stroke-width:2}.five{fill:#FF8C37}.three{fill:#33D6A6}.ground{fill:#a9b3b7}
    </style>
  </defs>
  <rect width="1200" height="590" rx="26" fill="url(#bg)"/>
  <path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M150 0V590M300 0V590M450 0V590M600 0V590M750 0V590M900 0V590M1050 0V590" stroke="#244048" stroke-width="1" opacity=".55"/>
  <text x="58" y="64" class="title">MICROMOUSE POWER PATH</text>
  <text x="58" y="94" class="small">Adjust and verify the 5 V output before connecting the controller.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="220" height="180" rx="18" class="box"/>
    <rect x="88" y="187" width="58" height="94" rx="10" fill="#24383e" stroke="#33D6A6" stroke-width="3"/>
    <rect x="154" y="187" width="58" height="94" rx="10" fill="#24383e" stroke="#33D6A6" stroke-width="3"/>
    <rect x="105" y="173" width="24" height="12" rx="3" class="ground"/><rect x="171" y="173" width="24" height="12" rx="3" class="ground"/>
    <text x="232" y="205" text-anchor="end" class="label">2S PACK</text>
    <text x="232" y="238" text-anchor="end" class="small">7.4 V nominal</text>
    <text x="232" y="266" text-anchor="end" class="small">8.4 V full</text>
    <text x="232" y="296" text-anchor="end" class="mono three">BMS / PROTECTED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="170" width="140" height="130" rx="16" class="box"/>
    <path d="M363 215h74M370 238h60M381 260h38" stroke="#FF8C37" stroke-width="8" stroke-linecap="round"/>
    <text x="400" y="330" text-anchor="middle" class="mono five">FUSE + SWITCH</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="135" width="260" height="200" rx="18" class="box"/>
    <circle cx="665" cy="215" r="43" fill="#263a40" stroke="#FF8C37" stroke-width="4"/>
    <path d="M665 188v54M638 215h54" stroke="#FF8C37" stroke-width="5"/>
    <text x="665" y="283" text-anchor="middle" class="label">BUCK CONVERTER</text>
    <text x="665" y="312" text-anchor="middle" class="mono five">SET TO 5.00 V</text>
    <text x="555" y="164" class="mono three">IN</text><text x="750" y="164" class="mono five">OUT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="135" width="270" height="200" rx="18" class="box"/>
    <rect x="920" y="180" width="170" height="92" rx="10" fill="#24383e" stroke="#FF8C37" stroke-width="3"/>
    <circle cx="946" cy="300" r="9" class="ground"/><circle cx="1064" cy="300" r="9" class="ground"/>
    <text x="1005" y="220" text-anchor="middle" class="label">ESP32-C6</text>
    <text x="1005" y="250" text-anchor="middle" class="mono five">5V INPUT</text>
    <text x="1005" y="365" text-anchor="middle" class="small">onboard LDO</text>
  </g>

  <path d="M275 225H330" stroke="#33D6A6" stroke-width="8" marker-end="url(#arrow3)"/>
  <path d="M470 225H535" stroke="#33D6A6" stroke-width="8" marker-end="url(#arrow3)"/>
  <path d="M795 225H870" stroke="#FF8C37" stroke-width="8" marker-end="url(#arrow5)"/>
  <text x="832" y="205" text-anchor="middle" class="mono five">5 V</text>

  <path d="M1005 335V420H840" stroke="#33D6A6" stroke-width="8" marker-end="url(#arrow3)"/>
  <g filter="url(#shadow)">
    <rect x="535" y="385" width="300" height="120" rx="18" class="box"/>
    <text x="685" y="430" text-anchor="middle" class="label">3.3 V SENSORS</text>
    <text x="685" y="463" text-anchor="middle" class="small">SEN0142 + 3x GY-530</text>
    <text x="685" y="490" text-anchor="middle" class="mono three">3V3 LOGIC ONLY</text>
  </g>
  <text x="894" y="405" class="mono three">3.3 V</text>

  <path d="M165 365H1080" stroke="#a9b3b7" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M165 325V365M665 335V365M1005 335V365M685 365V385" stroke="#a9b3b7" stroke-width="4"/>
  <text x="1080" y="392" text-anchor="end" class="mono ground">COMMON GROUND</text>

  <rect x="55" y="525" width="1090" height="42" rx="10" fill="#3b1c1c" stroke="#FF8C37" stroke-width="2"/>
  <text x="600" y="553" text-anchor="middle" class="mono five">NOT A CHARGER • VERIFY POLARITY • ONE ESP32 POWER SOURCE AT A TIME</text>
</svg>

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 300' width='660' height='300' role='img' aria-label='Velocity profiles for a pivot turn against a smooth arc turn'><title>Velocity profiles for a pivot turn against a smooth arc turn</title><rect width='660' height='300' fill='#17181C' rx='3'/><line x1='62' y1='224' x2='602' y2='224' stroke='rgba(237,242,240,.55)' stroke-width='1'/><line x1='62' y1='44' x2='62' y2='224' stroke='rgba(237,242,240,.55)' stroke-width='1'/><text x='54' y='52' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5' text-anchor='end'>v</text><text x='602' y='244' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5' text-anchor='end'>distance along the route</text><path d='M 62 224 L 148 53 L 246 53 L 300 224 L 364 224 L 418 53 L 516 53 L 602 224' fill='none' stroke='#EC3750' stroke-width='3.4' stroke-linejoin='round' stroke-dasharray='6 5'/><path d='M 62 224 L 148 44 L 278 44 L 332 112 L 386 44 L 516 44 L 602 224' fill='none' stroke='#33D6A6' stroke-width='3.4' stroke-linejoin='round' stroke-dasharray=''/><line x1='332' y1='44' x2='332' y2='224' stroke='rgba(127,212,188,.22)' stroke-width='1' stroke-dasharray='3 4'/><text x='332' y='34' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5' text-anchor='middle'>the corner</text><rect x='62' y='255' width='22' height='3.4' fill='#EC3750'/><text x='94' y='261' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='11'>PIVOT TURN &#183; stop, rotate 90&#176;, go</text><rect x='62' y='275' width='22' height='3.4' fill='#33D6A6'/><text x='94' y='281' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='11'>SMOOTH ARC &#183; carry speed through the bend</text><text x='62' y='286' fill='rgba(237,242,240,.55)' font-family='JetBrains Mono, Cascadia Code, Consolas, monospace' font-size='10.5'>Area under the curve is ground covered; the gap between the curves is the race.</text></svg>